<!DOCTYPE html>
<html lang="en">
    <head>
        <title>quote</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f0f0f0;
                text-align: center;
                padding: 20px;
                border-radius: 10px;
                border: 4px solid black;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                margin:0;
                min-height: 100vh;
                box-sizing: border-box;
                background-attachment: fixed;
                background: linear-gradient(-45deg, #667eea, #764ba2, #ff69b4, #23d5ab);
background-size: 400% 400%;
animation: moveBg 10s ease infinite;
            }
            @keyframes moveBg {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
            h2{
                color: #333;
                margin-bottom: 20px;

            }
            .fade{
                animation: fadeIn 0.6s ease;
            }
            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            #quote {
                font-size: 18px;
                margin: 20px 0;
                background-color: #fff;
                padding: 70px;
                border-radius: 15px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                border: 2px solid rgb(61, 47, 255);
                background: rgba(255, 255, 255, 0.25);
backdrop-filter: blur(12px);
border: 2px solid rgba(255, 255, 255, 0.6);
color: #2d1b4e;
                
    
            }
            button:hover {
                background-color: #ccc;
                
            }
            .back:hover {
                background-color: #ccc;
                
            }
            button{
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
                border: none;
                border-radius: 5px;
                background-color: #4c91af;
                color: white;
            }
       .back{
    text-decoration: none;
    padding: 10px 20px;
    background: #283d29;
    color: white;
    border-radius: 30px;
    padding: 17px 24px;
    font-size: 14px;
    margin-top: 14px;
    margin-bottom: 20px;
}
            
        </style>
    </head>
    <body>
        <h1>COLLEGE DIARIES: QUOTE CORNER</h1>
        <h2 id="quote">CLICK FOR A QUOTE</h2>
        <button onclick="newquote()">New Quote</button>
        <a href="index.html" class="back">Back To Home Page</a>
        <script>
            const quotes = [
                "The best way to get started is to quit talking and begin doing.",
                "Don't let yesterday take up too much of today.",
                "It's not whether you get knocked down, it's whether you get up.",
                "If you are working on something exciting, it will keep you motivated.",
                "Success is not in what you have, but who you are.",
                "Be so good they can't ignore you.",
                "Dream big Work hard Stay humble.",
                "Your only limit is your mind.",
                "One day or day one. You decide.",
                "Difficult roads often lead to beautiful destinations.",
                "Make yourself proud.",
                "Don't watch the clock; do what it does. Keep going.",
                "The harder you work for something, the greater you'll feel when you achieve it.",
                "Don't stop when you're tired. Stop when you're done.",
                "Wake up with determination. Go to bed with satisfaction.",
                "Do something today that your future self will thank you for.",
                "Little things make big days.",
                "It's going to be hard, but hard does not mean impossible.",
                "Don't wait for opportunity. Create it."
            ];

            function newquote() {
                // Implementation for generating a new quote
                const randomIndex = Math.floor(Math.random() * quotes.length);
                document.getElementById("quote").textContent = quotes[randomIndex];
            }
        </script>
    </body>
</html>
